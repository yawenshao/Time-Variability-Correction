[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tvc-climate"
version = "0.2.0"
description = "Time Variability Correction for climate-model time series"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
authors = [{ name = "Yawen Shao" }]
dependencies = ["numpy>=1.23", "pandas>=1.5", "scipy>=1.9"]

[project.optional-dependencies]
demo = ["matplotlib>=3.6"]
research = ["xarray>=2023.1", "netCDF4>=1.6", "matplotlib>=3.6", "seaborn>=0.12", "cartopy>=0.21"]
dashboard = ["streamlit>=1.45", "plotly>=5.18", "xarray>=2023.1", "netCDF4>=1.6"]
test = ["pytest>=7.0", "pytest-cov>=4.0"]
dev = ["tvc-climate[test,demo,dashboard]", "ruff>=0.5", "mypy>=1.8", "pre-commit>=3.5"]

[project.urls]
Paper = "https://doi.org/10.1029/2023MS003640"
Archive = "https://doi.org/10.5281/zenodo.10212122"
Source = "https://github.com/yawenshao/Time-Variability-Correction"

[tool.setuptools]
package-dir = { "" = "src" }
py-modules = ["TVC_class", "statistics_tool"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"

[tool.ruff]
line-length = 110
target-version = "py39"
# The method and paper-script code is kept verbatim from the published version.
extend-exclude = ["src/tvc/core.py", "src/tvc/metrics.py", "scripts/paper"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.mypy]
python_version = "3.9"
ignore_missing_imports = true
exclude = ["scripts/paper/"]
